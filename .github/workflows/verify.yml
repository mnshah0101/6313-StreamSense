name: Verify development scaffold
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: streamsense
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: streamsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamsense -d streamsense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make verify
      - run: make verify-db
        env:
          DATABASE_URL: postgresql+psycopg://streamsense:ci-disposable-only@127.0.0.1:5432/streamsense_test
