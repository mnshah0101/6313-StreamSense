[project]
name = "streamsense-api"
version = "0.1.0"
description = "CRUD + GPU inference service behind the StreamSense review UI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "boto3>=1.34",
]

[project.optional-dependencies]
# Real model backend: same pins as the playonsports training repo, whose `streamsense`
# package is imported from STREAMSENSE_API_STREAMSENSE_REPO (not installed from PyPI).
gpu = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==5.3.0",
  "peft==0.18.1",
  "accelerate==1.13.0",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "pandas==2.3.3",
  "pyarrow==21.0.0",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "moto[s3]>=5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: the formatter owns line length. B008: FastAPI's Depends() idiom. B027: optional hooks.
ignore = ["E501", "B008", "B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
