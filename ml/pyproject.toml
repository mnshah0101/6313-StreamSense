[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "streamsense"
version = "0.1.0"
description = "Reproducible per-frame sports-stream quality experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "numpy==2.2.6",
  "Pillow==12.1.1",
]

[project.optional-dependencies]
analysis = [
  "pandas==2.3.3",
  "pyarrow==21.0.0",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "matplotlib==3.10.8",
  "ImageHash==4.3.2",
]
models = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==5.3.0",
  "peft==0.18.1",
  "accelerate==1.13.0",
  "tensorboard==2.20.0",
  "flash-linear-attention==0.5.2",
]
classical = ["pyiqa==0.1.16"]
serve = ["vllm==0.17.1; sys_platform == 'linux'"]
tracking = [
    "mlflow==3.16.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.10",
    "pre-commit==4.5.1",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "nbconvert==7.17.1",
    "ipykernel==7.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["streamsense"]

[tool.hatch.build.targets.wheel.force-include]
conf = "streamsense/conf"

[tool.hatch.build.targets.sdist]
include = ["streamsense/", "conf/", "scripts/", "tests/", "docs/*.md", "README.md", "pyproject.toml", "uv.lock", ".python-version"]
exclude = ["docs/DATA_SCHEMA.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["./.tools", "./data", "./outputs", "./multirun"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebook prose: markdown table rows cannot be wrapped.
"scripts/build_report_notebook.py" = ["E501"]

[tool.uv]
required-version = ">=0.9"
# vLLM owns its Torch/Transformers stack. Use a separate serving environment.
conflicts = [
  [{ extra = "serve" }, { extra = "models" }],
  [{ extra = "serve" }, { extra = "classical" }],
]
