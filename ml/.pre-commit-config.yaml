repos:
  - repo: local
    hooks:
      - id: streamsense-private-data
        name: Block client data and model artifacts
        entry: python scripts/check_staged_data.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
