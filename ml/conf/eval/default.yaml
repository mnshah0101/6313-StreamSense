split: val
final_test: false
precision_targets: [0.90, 0.95]
selection_precision_target: 0.90
threshold_grid: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
threshold_fit_split: val
bootstrap_samples: 1000
bootstrap_unit: game_id
confidence_bins: 10
top_k_errors: 20
parse_failure_policy: negative_and_report
user_subset: true
zero_support_policy: omit_metrics_report_support
severity_mos: {1: 4.0, 2: 3.5, 3: 3.0, 4: 2.0, 5: 1.0}
threshold_candidates: unique_scores  # exact search; 'grid' uses threshold_grid
run_dir: null  # training run whose predictions/ are evaluated
